<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stay Hard - Health Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #2a2a2a;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #fff;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      margin-bottom: 14px;
      outline: none;
    }

    input:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ddd;
    }

    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      display: none;
    }

    .result.show {
      display: block;
    }

    .underweight { background: #1e3a5f; }
    .normal { background: #1e3a2f; }
    .overweight { background: #5c3b1e; }
    .obese { background: #5c1e1e; }

    .bmi-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .bmi-status {
      font-size: 15px;
      opacity: 0.9;
    }

    .advice {
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.5;
    }

    /* Checklist */
    .checklist-input {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .checklist-input input {
      margin-bottom: 0;
      flex: 1;
    }

    .checklist-input button {
      width: auto;
      padding: 0 18px;
      white-space: nowrap;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .todo-item:last-child {
      border-bottom: none;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #fff;
      cursor: pointer;
    }

    .todo-item span {
      flex: 1;
      font-size: 15px;
    }

    .todo-item.done span {
      text-decoration: line-through;
      color: #666;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 18px;
      cursor: pointer;
      width: auto;
      padding: 0 6px;
    }

    .delete-btn:hover {
      color: #ff5555;
    }

    .empty {
      text-align: center;
      color: #555;
      font-size: 14px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>STAY HARD</h1>
    <p class="subtitle">Health Tracker</p>

    <!-- BMI Calculator -->
    <div class="card">
      <h2>BMI Calculator</h2>
      
      <label>Chiều cao (cm)</label>
      <input type="number" id="height" placeholder="Ví dụ: 170" min="100" max="250">

      <label>Cân nặng (kg)</label>
      <input type="number" id="weight" placeholder="Ví dụ: 65" min="30" max="300">

      <button onclick="calculateBMI()">Tính BMI</button>

      <div id="result" class="result">
        <div class="bmi-value" id="bmiValue">0</div>
        <div class="bmi-status" id="bmiStatus"></div>
        <div class="advice" id="advice"></div>
      </div>
    </div>

    <!-- Checklist -->
    <div class="card">
      <h2>Daily Checklist</h2>
      
      <div class="checklist-input">
        <input type="text" id="todoInput" placeholder="Thêm việc cần làm..." onkeypress="if(event.key==='Enter') addTodo()">
        <button onclick="addTodo()">Thêm</button>
      </div>

      <div id="todoList"></div>
    </div>
  </div>

  <script>
    // ===== BMI =====
    function calculateBMI() {
      const height = parseFloat(document.getElementById('height').value);
      const weight = parseFloat(document.getElementById('weight').value);
      const resultBox = document.getElementById('result');

      if (!height || !weight || height < 100 || weight < 30) {
        alert('Vui lòng nhập chiều cao và cân nặng hợp lệ');
        return;
      }

      const heightM = height / 100;
      const bmi = weight / (heightM * heightM);
      const bmiRounded = bmi.toFixed(1);

      let status = '';
      let advice = '';
      let className = '';

      if (bmi < 18.5) {
        status = 'Gầy (Underweight)';
        advice = 'Nên tăng khẩu phần ăn, tập trung vào protein và tập gym tăng cơ.';
        className = 'underweight';
      } else if (bmi < 25) {
        status = 'Bình thường (Normal)';
        advice = 'Duy trì thói quen hiện tại. Tiếp tục kỷ luật.';
        className = 'normal';
      } else if (bmi < 30) {
        status = 'Thừa cân (Overweight)';
        advice = 'Giảm tinh bột và đường. Tăng cardio + tập tạ. Kiểm soát khẩu phần.';
        className = 'overweight';
      } else {
        status = 'Béo phì (Obese)';
        advice = 'Cần thay đổi nghiêm túc. Giảm calo, cắt đồ ngọt, tập luyện đều đặn.';
        className = 'obese';
      }

      document.getElementById('bmiValue').innerText = bmiRounded;
      document.getElementById('bmiStatus').innerText = status;
      document.getElementById('advice').innerText = advice;

      resultBox.className = 'result show ' + className;
    }

    // ===== CHECKLIST =====
    let todos = JSON.parse(localStorage.getItem('todos') || '[]');

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function renderTodos() {
      const list = document.getElementById('todoList');
      
      if (todos.length === 0) {
        list.innerHTML = '<div class="empty">Chưa có việc nào</div>';
        return;
      }

      list.innerHTML = todos.map((todo, index) => `
        <div class="todo-item ${todo.done ? 'done' : ''}">
          <input type="checkbox" \( {todo.done ? 'checked' : ''} onchange="toggleTodo( \){index})">
          <span>${todo.text}</span>
          <button class="delete-btn" onclick="deleteTodo(${index})">×</button>
        </div>
      `).join('');
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();
      
      if (!text) return;

      todos.push({ text, done: false });
      saveTodos();
      renderTodos();
      input.value = '';
      input.focus();
    }

    function toggleTodo(index) {
      todos[index].done = !todos[index].done;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveTodos();
      renderTodos();
    }

    // Khởi tạo
    renderTodos();
  </script>
</body>
</html>
